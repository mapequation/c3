name: Publish Python package

# Publishes c3-colors to PyPI with trusted publishing when a GitHub release is published.
# The release tag must match the version in python/pyproject.toml, like v2.0.1.

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: python

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uv version --short)" = "$TAG"

      - name: Test
        run: uv run --locked pytest

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/c3-colors/

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2
